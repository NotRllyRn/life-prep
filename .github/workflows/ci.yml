name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/life-prep ./cmd/life-prep
      - run: bin/life-prep demo "$RUNNER_TEMP/life-prep-demo"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Exercise the real adapter/filter contract, not copied Hermes stubs.
      - uses: actions/checkout@v4
        with:
          repository: NotRllyRn/hermes-agent-codex-broker
          ref: 5fdcb6c2f4690b04858008c4f60d80faa94b19b9
          path: .ci-hermes
      - run: python -m pip install -e .ci-hermes
      - run: python -m unittest discover -s integrations/hermes -p 'test_*.py' -v
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci-hermes
          LIFE_PREP_TEST_BINARY: ${{ github.workspace }}/bin/life-prep
