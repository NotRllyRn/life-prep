name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/life-prep ./cmd/life-prep
      - run: bin/life-prep demo "$RUNNER_TEMP/life-prep-demo"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s integrations/hermes -p 'test_*.py' -v
